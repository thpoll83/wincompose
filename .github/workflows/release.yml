name: Release

# Same shape as the other PolyKybd repos: a release is created by PUBLISHING it
# (scripts/publish_release.py, or the GitHub UI), which fires `release:
# published`; this workflow then applies the crafted notes and attaches the
# built assets. The tag-push trigger is kept for a tag pushed by hand.
on:
  push:
    tags:
      - 'PK-*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to attach the built assets to (e.g. PK-0.9.16).
          Leave EMPTY to only build the assets as artifacts, releasing nothing —
          that is the safe smoke test. Set it to recover a release whose build
          failed: a re-run of the original `release` run would replay the
          workflow file from that tag's commit, bug included, so a dispatch from
          the fixed default branch is the way to attach the assets afterwards.
        required: false
        default: ''

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and release WinCompose
    runs-on: windows-latest

    # Read by the `status` job below; set from the built exe's version resource.
    outputs:
      version: ${{ steps.assets.outputs.version }}

    # Mapped to env because a step's `if` cannot read the secrets context. While
    # these are unset the signing step is skipped and builds stay green unsigned
    # (same dormant wiring as build.yml).
    env:
      SIGNING_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
      SIGNING_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
      SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
      SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}

    steps:
      - uses: actions/checkout@v4
        with:
          # installer.iss pulls its wizard resources from the issrc submodule
          # (INNODIR ../3rdparty/innosetup/Files), and the build embeds data
          # files from the other 3rdparty submodules — so recursive, and full
          # history for GitVersion (see build.yml for the LibGit2Sharp crash).
          submodules: recursive
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # src/installer/installer.csproj's Build target shells out to
      # "%ProgramFiles(x86)%\Inno Setup 6\iscc", so Inno Setup has to exist at
      # exactly that path.
      #
      # ⚠️ Do NOT pin a version here. windows-latest already ships Inno Setup
      # (6.7.1 as of 2026-08), and `choco install innosetup --version=6.2.2`
      # FAILS the step outright — "A newer version of InnoSetup (v6.7.1) is
      # already installed. Use --allow-downgrade or --force" — exit code 1.
      # Install only when it is genuinely missing, then assert the path the
      # csproj hardcodes, so a runner-image change surfaces as a clear error
      # instead of a confusing msbuild failure later.
      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            "Inno Setup already present: $((Get-Item $iscc).VersionInfo.ProductVersion)"
          } else {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup not at '$iscc' — src/installer/installer.csproj hardcodes this path."
          }

      # wincompose.csproj has an InsertIcons target that runs this tool after the
      # build; building the project on its own does not build it. Same pinning as
      # build.yml (old-style project defines no OutputPath for x86).
      - name: Build InsertIcons
        run: msbuild src\3rdparty\inserticons\inserticons.csproj -restore -p:Configuration=Release -p:Platform=AnyCPU -p:OutputPath=bin/Release/ -v:minimal

      - name: Build (Release)
        run: msbuild src\wincompose\wincompose.csproj -restore -p:Configuration=Release -v:minimal

      # Before packaging, so both the installer payload and the portable zip
      # carry signed binaries and the published checksums cover the signed bytes.
      - name: Sign binaries
        if: env.SIGNING_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ env.SIGNING_TENANT_ID }}
          azure-client-id: ${{ env.SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ env.SIGNING_CLIENT_SECRET }}
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files-folder: src/wincompose/bin/Release
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # installer.iss line 54 bundles bin\Release\installer-helper.dll, a C++
      # DLL that is NOT part of the .NET build — src/Makefile gets it by building
      # the whole solution, whereas this workflow builds projects individually
      # (so that signing can run between the app build and packaging). Without
      # it iscc aborts with 'Source file "…\installer-helper.dll" does not exist'.
      # Win32 is the only platform the vcxproj defines, and its OutDir
      # (bin\$(Configuration)\) is already the path the .iss expects.
      - name: Build installer helper (C++)
        run: msbuild src\installer\installer-helper.vcxproj -p:Configuration=Release -p:Platform=Win32 -v:minimal

      - name: Verify installer payload
        shell: pwsh
        run: |
          $dll = 'src/installer/bin/Release/installer-helper.dll'
          if (-not (Test-Path $dll)) { throw "installer-helper.dll missing at $dll" }
          "installer-helper.dll: $((Get-Item $dll).Length) bytes"

      # iscc derives the version from the built wincompose.exe's version
      # resource (GetVersionComponents) and writes WinCompose-Setup-<ver>.exe to
      # OutputDir `..\` — i.e. src\.
      - name: Build installer
        run: msbuild src\installer\installer.csproj -p:Configuration=Release -v:minimal

      # The raw bin directory is NOT runnable as a portable install: Utils
      # decides it is "debugging" when a .pdb sits next to the exe, which sends
      # the rule lookup to ../../../rules and loses Emoji.txt/WinCompose.txt.
      # Mirror what src/Makefile assembles for the portable zip instead.
      # (Kept in step with build.yml — change both together.)
      - name: Package portable
        shell: pwsh
        run: |
          $tfm = @(Get-ChildItem 'src/wincompose/bin/Release' -Directory)
          if ($tfm.Count -ne 1) { throw "expected one TFM directory under bin/Release, found $($tfm.Count)" }
          $bin = $tfm[0].FullName
          $out = 'portable'
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "$bin/*" $out -Recurse
          Get-ChildItem $out -Recurse -Include *.pdb | Remove-Item -Force
          New-Item -ItemType Directory -Path "$out/rules" | Out-Null
          Copy-Item 'src/wincompose/rules/DefaultUserSequences.txt', `
                    'src/wincompose/rules/Emoji.txt', `
                    'src/wincompose/rules/WinCompose.txt' "$out/rules/"
          # These are the only way back into the UI once the tray icon is
          # hidden, so the portable layout ships them like the Makefile does.
          'start wincompose.exe -settings'  | Set-Content "$out/wincompose-settings.bat"
          'start wincompose.exe -sequences' | Set-Content "$out/wincompose-sequences.bat"
          if (Test-Path "$out/wincompose.pdb") { throw 'pdb survived' }
          if (-not (Test-Path "$out/rules/Emoji.txt")) { throw 'rules missing' }

      # Until the builds are signed, a published checksum is the only way for
      # someone to confirm a download matches what CI produced — the docs tell
      # users to check against SHA256SUMS.txt, so it covers BOTH assets.
      - name: Assemble release assets
        id: assets
        shell: pwsh
        run: |
          $ver = (Get-Item 'portable/wincompose.exe').VersionInfo.FileVersion
          # FileVersion is 4-part (0.9.16.0); the asset names use MAJOR.MINOR.REV,
          # matching iscc's VERSION and src/Makefile.
          $ver = ($ver -split '\.')[0..2] -join '.'
          $setup = "src/WinCompose-Setup-$ver.exe"
          if (-not (Test-Path $setup)) { throw "installer not found at $setup" }
          New-Item -ItemType Directory -Path 'release' | Out-Null
          $zip = "WinCompose-NoInstall-$ver.zip"
          Compress-Archive -Path 'portable/*' -DestinationPath "release/$zip"
          Copy-Item $setup 'release/'
          # Hash our own files, not the artifact zip whose bytes GitHub controls.
          Get-ChildItem 'release' -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content 'release/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'release/SHA256SUMS.txt'
          "version=$ver" >> $env:GITHUB_OUTPUT

      # ⚠️ The shipped version is HARDCODED in src/wincompose/wincompose.csproj,
      # and the tag is chosen independently — scripts/publish_release.py takes it
      # from the release-notes branch. So publishing before the bump has merged
      # ships assets labelled with the PREVIOUS version, and everything
      # downstream reads that same number off the built binary: the About tab
      # (Settings.Version), iscc's installer filename, the zip name, and the
      # version Updater.cs compares against status.txt.
      #
      # 0.9.19 did exactly that (issue #21): the bump sat unmerged on a branch
      # for 50 minutes and the release went out in that window, so PK-0.9.19
      # carries WinCompose-Setup-0.9.18.exe, the About tab reads 0.9.18, and
      # status.txt could not be bumped at all — an install reporting 0.9.18
      # would have been offered an endless update to itself.
      #
      # Fail here, before anything is attached. Recovery is in RELEASE.md: bump
      # the default branch, then workflow_dispatch with this tag.
      - name: Assert the built version matches the tag
        if: github.event_name == 'release' || github.ref_type == 'tag' || inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          VERSION: ${{ steps.assets.outputs.version }}
        run: |
          want="${TAG#PK-}"
          if [ "$want" != "$VERSION" ]; then
            echo "::error::Tag $TAG wants $want, but this build produced $VERSION."
            echo "<AssemblyVersion>/<FileVersion> in src/wincompose/wincompose.csproj decide"
            echo "the shipped version. Bump them on the default branch, then re-run this"
            echo "workflow by hand (workflow_dispatch, tag: $TAG) to attach the assets."
            exit 1
          fi
          echo "Built version $VERSION matches tag $TAG."

      # Always upload, so a workflow_dispatch smoke test yields inspectable
      # assets without touching any release.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wincompose-release-assets
          path: release/
          if-no-files-found: error

      # Crafted release notes (optional): one file per tag on the unprotected
      # `release-notes` branch — <TAG>.md, first line "# <title>", the rest the
      # body. Files are keyed by tag, so they are never overwritten or deleted —
      # the branch is an accumulating changelog archive. A missing file just
      # falls back to --generate-notes, so this step is safe if unused.
      - name: Fetch crafted release notes (if any)
        id: notes
        if: github.event_name == 'release' || github.ref_type == 'tag' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          if gh api "repos/${{ github.repository }}/contents/${TAG}.md?ref=release-notes" \
               --jq '.content' 2>/dev/null | base64 -d > _release_notes.md && [ -s _release_notes.md ]; then
            TITLE=$(head -n1 _release_notes.md | sed 's/^#\s*//')
            tail -n +2 _release_notes.md | sed '/./,$!d' > _release_body.md
            {
              echo "have_notes=1"
              echo "title=$TITLE"
            } >> "$GITHUB_OUTPUT"
            echo "Using crafted notes for $TAG (title: $TITLE)."
          else
            echo "have_notes=0" >> "$GITHUB_OUTPUT"
            echo "No crafted notes on the release-notes branch for $TAG — auto-generating."
          fi

      # Idempotent: creates the release if missing, otherwise (re-)uploads the
      # assets with --clobber; a create that loses a race falls back to upload.
      # Guarded so a workflow_dispatch with no `tag` input builds as a smoke test
      # only, while one WITH a tag attaches to that existing release.
      - name: Create or update GitHub Release
        if: github.event_name == 'release' || github.ref_type == 'tag' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          HAVE_NOTES: ${{ steps.notes.outputs.have_notes }}
          TITLE: ${{ steps.notes.outputs.title }}
          VERSION: ${{ steps.assets.outputs.version }}
        run: |
          ASSETS=( release/WinCompose-Setup-${VERSION}.exe \
                   release/WinCompose-NoInstall-${VERSION}.zip \
                   release/SHA256SUMS.txt )
          if [ "$HAVE_NOTES" = "1" ]; then
            NOTES_ARGS=( --title "$TITLE" --notes-file _release_body.md )
          else
            NOTES_ARGS=( --title "WinCompose $TAG" --generate-notes )
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The normal path: the release was published (UI or
            # scripts/publish_release.py) and this run attaches the assets.
            if [ "$HAVE_NOTES" = "1" ]; then
              echo "Release $TAG exists — applying crafted notes + uploading assets."
              gh release edit "$TAG" --title "$TITLE" --notes-file _release_body.md
            else
              echo "Release $TAG exists — uploading assets (keeping existing notes)."
            fi
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG (falls back to upload if a concurrent run won the create)."
            gh release create "$TAG" "${NOTES_ARGS[@]}" "${ASSETS[@]}" \
            || gh release upload "$TAG" "${ASSETS[@]}" --clobber
          fi

  # ④ of RELEASE.md, automated. Updater.cs reads status.txt from the DEFAULT
  # branch and offers a download the moment `Latest` exceeds the running
  # version, so the bump has to land AFTER the release exists — which is why it
  # was a manual step, and why it kept going wrong in both directions. Early,
  # every install is pointed at a release that is not there; the URLs resolve
  # releases/latest, so nobody gets a 404 and everybody is handed the version
  # they already have (0.9.18, a 20-minute window). Late, no install ever learns
  # the release happened and nothing about the release looks wrong (0.9.19, two
  # weeks, reported from outside as "no notification" — issue #21).
  #
  # This runs after the assets are attached and takes the version from the
  # binary that was just shipped, so it cannot name a release that does not
  # exist, and it cannot name a version other than the one in the download.
  status:
    name: Point status.txt at the released version
    needs: release
    if: github.event_name == 'release' || github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # The release job checked out the TAG (and its submodules); status.txt is
      # edited on the default branch, so this takes its own shallow checkout
      # rather than moving that working tree out from under the build.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bump Latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$VERSION" ] || { echo "::error::no version from the release job"; exit 1; }

          # ⚠️ Ask GitHub for the release's state rather than reading
          # github.event.release: on a tag push or a workflow_dispatch recovery
          # that payload does not exist, so a prerelease/draft test against it
          # passes silently. It matters because `releases/latest` EXCLUDES a
          # prerelease, so announcing one sets Latest to a version whose
          # Installer:/Portable: links still resolve to the previous stable
          # release -- every install offered an update and handed the files it
          # already has, which is the 0.9.18 failure over again. A tag with no
          # release at all lands here too, and is equally nothing to announce.
          # (Found by Greptile on #25.)
          if ! state=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                         --jq '[.draft, .prerelease] | @tsv' 2>/dev/null); then
            echo "::notice::no release for ${TAG} — status.txt left alone."
            exit 0
          fi
          if [ "$(cut -f1 <<<"$state")" = true ] || [ "$(cut -f2 <<<"$state")" = true ]; then
            echo "::notice::${TAG} is a draft or prerelease — status.txt left alone."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # ⚠️ Re-read main on every attempt and REGENERATE the edit. Rebasing a
          # commit written against an older status.txt replays a patch whose
          # context is the `Latest:` line another run has already changed: it
          # conflicts, and the newer release is then left unannounced — the
          # failure this job exists to prevent. Two runs is the normal case (the
          # push and the release event both fire this workflow), and two
          # releases published back to back give two different versions. The
          # commit is a one-line state assertion, not a patch worth preserving.
          # (Found by Revix on #25.)
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main

            current=$(sed -nE 's/^Latest:[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' status.txt)
            [ -n "$current" ] || { echo "::error::no 'Latest:' line in status.txt"; exit 1; }
            echo "attempt $attempt: status.txt says $current, the release shipped $VERSION"

            if [ "$current" = "$VERSION" ]; then
              echo "Already there — nothing to do."
              exit 0
            fi
            # Never roll BACKWARDS: re-dispatching an old tag to re-attach its
            # assets must not un-announce a newer release.
            if [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
              echo "::notice::status.txt is at $current, ahead of $VERSION — left alone."
              exit 0
            fi

            sed -i -E "s/^Latest:[[:space:]]+.*/Latest:  ${VERSION}/" status.txt
            grep -n '^Latest:' status.txt
            git add status.txt
            # [skip ci] keeps this out of build.yml, which builds every push to main.
            git commit -q -m "Point status.txt at ${VERSION} [skip ci]"

            if git push -q origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — main moved under us. Re-reading it and retrying."
          done
          echo "::error::could not push the status.txt bump after 3 attempts. The release"
          echo "itself is fine — set 'Latest:  ${VERSION}' in status.txt on main by hand."
          exit 1
